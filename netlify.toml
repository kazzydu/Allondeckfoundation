# AllONDECK Foundation site (allondeckfoundation.org). Static, no build step.
# Donations: the page uses Flutterwave's public key; payment confirmations go to
# the webhook configured in the Flutterwave dashboard (on the business site), which
# records Foundation gifts in foundation_donations. Nothing here handles payments.

[build]
  publish = "."

[[edge_functions]]
  function = "nopreview"
  path = "/*"

# Old addresses
[[redirects]]
  from = "/foundation"
  to = "/"
  status = 301
[[redirects]]
  from = "/foundation.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Repo files that are not part of the site
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
